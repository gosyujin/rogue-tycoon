<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>rogue-tycoon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="status"></div>
  <div id="map-box"><pre id="map"></pre><div id="menu" hidden></div></div>
  <div id="log"></div>
  <div id="controls">
    <div id="dpad">
      <button data-dir="-1,-1">↖</button>
      <button data-dir="0,-1">↑</button>
      <button data-dir="1,-1">↗</button>
      <button data-dir="-1,0">←</button>
      <button data-dir="0,0">・</button>
      <button data-dir="1,0">→</button>
      <button data-dir="-1,1">↙</button>
      <button data-dir="0,1">↓</button>
      <button data-dir="1,1">↘</button>
    </div>
    <div id="actions">
      <button data-act="items">道具</button>
      <button data-act="floor">足元</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
